name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web (Vite)
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
        run: npm run build

      - name: Sync Capacitor con Android
        run: npx cap sync android

      - name: Hacer gradlew ejecutable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Verificar entorno (debug)
        working-directory: android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          ./gradlew --version

      - name: Build APK Debug (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK con nombre fijo + versionado
        run: |
          mkdir -p out
          DATE=$(date +%Y%m%d-%H%M)
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk out/lifehigh.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/lifehigh-${DATE}-${SHA}.apk"
          ls -lh out/

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: lifehigh-apk
          path: out/*.apk
          retention-days: 30

      - name: Crear/actualizar Release "latest" (en push a main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'Life High APK (latest)'
          body: |
            APK más reciente, compilado desde commit `${{ github.sha }}`.

            **URL estable de descarga directa:**
            ```
            https://github.com/ArrayagoM/repelis/releases/download/apk-latest/lifehigh.apk
            ```

            **Instalación en proyector / TV Android (5.0+):**
            1. Descargá `lifehigh.apk` de Assets abajo
            2. Copialo al proyector vía USB o descargá directo desde Chrome del proyector
            3. Tap en el .apk → Instalar
            4. Si pide "fuentes desconocidas" → habilitar

            WebView nativo, **compatible con Android 5.0+** (cubre 99% de dispositivos).
          files: out/*.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
