name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-24.04
    # Permissions críticos: sin esto el step "Release" da 403 al GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Capacitor 8 lo exige)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Capacitor 8 lo exige)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK (el runner ya lo trae instalado; solo aceptamos licencias)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sudo mkdir -p "$ANDROID_HOME/licenses"
          for h in 24333f8a63b6825ea9c5514f83c2829b004d1fee 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e e9acab5b5fbb560a72cfaecce8946896ff6aab9d 601085b94cd77f0b54ff86406957099ebe79c4d6 859f317696f67ef3d7f30a50a5560e7834b43903; do
            echo "$h" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          done
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null
          # Licencias oficiales (los hashes cambian con cada versión de la licencia)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          sudo chmod a+rwx "$ANDROID_HOME"
          for d in licenses platforms build-tools ndk cmake platform-tools; do
            sudo mkdir -p "$ANDROID_HOME/$d"
            sudo chmod a+rwx "$ANDROID_HOME/$d"
          done
          ls "$ANDROID_HOME"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # Fallback del token TMDB si el secret no está configurado.
      # No es realmente "secret" porque viaja en el bundle del cliente igual.
      - name: Build web (Vite)
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN || 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIyM2RjYjQ5MDgwODc2YjMzNWQ4Njg0NDIzOTE1OGQ5NCIsIm5iZiI6MTc3NzIyOTc1MS4wODksInN1YiI6IjY5ZWU1ZmI3ODgzM2EyZDk5YjE3ZDljMSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.pO_Pt4O7iHbcnkvF84DqdLKvBLtdv7EKFJ-2OsTFqpY' }}
        run: |
          npm run build
          ls -la dist/

      - name: Sync Capacitor con Android
        run: |
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Verificar entorno
        working-directory: android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build APK Debug (Gradle)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Resumen del error de Gradle
        if: failure()
        run: |
          { grep -n -B2 -A14 -E "What went wrong|FAILURE: Build failed|Execution failed|error:|^e: " "$RUNNER_TEMP/gradle.log" | head -80; } > "$RUNNER_TEMP/summary.txt" || true
          echo "::error title=Gradle fallo::$(head -c 3500 "$RUNNER_TEMP/summary.txt" | tr '[:space:]' ' ')"

      - name: Listar outputs de Gradle
        run: |
          echo "=== APK generado ==="
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Preparar APK con nombre fijo + versionado
        run: |
          mkdir -p out
          DATE=$(date +%Y%m%d-%H%M)
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk out/lifehigh.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/lifehigh-${DATE}-${SHA}.apk"
          ls -lh out/

      - name: Subir APK como artifact descargable (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: lifehigh-apk
          path: out/*.apk
          retention-days: 30

      - name: Crear/actualizar Release "latest"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'Life High APK (latest)'
          body: |
            APK más reciente, compilado desde commit `${{ github.sha }}`.

            **URL estable de descarga directa:**
            ```
            https://github.com/ArrayagoM/repelis/releases/download/apk-latest/lifehigh.apk
            ```

            **Instalación en proyector / TV Android (5.0+):**
            1. Descargá `lifehigh.apk` de Assets abajo
            2. Copialo al proyector vía USB o descargá directo desde Chrome del proyector
            3. Tap en el .apk → Instalar
            4. Si pide "fuentes desconocidas" → habilitar

            WebView nativo, **compatible con Android 5.0+** (cubre 99% de dispositivos).
          files: out/*.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
