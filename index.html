<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repelis — Cinema sin límites</title>
    <meta name="description" content="Mirá las mejores películas y series del mundo, en un solo lugar." />
    <meta name="theme-color" content="#0E0E18" />

    <!-- Preconnect crítico: TMDB (metadatos + imágenes) -->
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />

    <!-- Preconnect a top 5 servidores de streaming (handshake DNS+TCP+TLS antes del clic) -->
    <link rel="preconnect" href="https://embedmaster.link" crossorigin />
    <link rel="preconnect" href="https://vidsrc.to" crossorigin />
    <link rel="preconnect" href="https://vidsrc.icu" crossorigin />
    <link rel="preconnect" href="https://vidlink.pro" crossorigin />
    <link rel="preconnect" href="https://embed.su" crossorigin />

    <!-- DNS prefetch para el resto (más liviano que preconnect) -->
    <link rel="dns-prefetch" href="https://vidsrc.pm" />
    <link rel="dns-prefetch" href="https://vidsrc.xyz" />
    <link rel="dns-prefetch" href="https://player.smashy.stream" />
    <link rel="dns-prefetch" href="https://multiembed.mov" />
    <link rel="dns-prefetch" href="https://player.autoembed.cc" />
    <link rel="dns-prefetch" href="https://www.2embed.cc" />
    <link rel="dns-prefetch" href="https://vidfast.pro" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
